# Daily data refresh, running on GitHub's servers (your laptop can be off).
#
# What it does, in order:
#   1. Restores yesterday's downloaded files from GitHub's cache (so only new data is fetched)
#   2. Runs src/download.py  -> fetches only files whose fingerprint (ETag) changed
#   3. Runs src/checks.py    -> stops here if the raw data looks wrong
#   4. Runs src/build.py     -> cleans the data and rebuilds the summary tables (sql/*.sql)
#   5. Runs src/forecast.py  -> 8-week price forecasts, only when the weekly prices changed
#   6. Runs the tests        -> stops here if the cleaned data, tables or forecasts look wrong
#   7. Commits the small CSV summary tables in data/marts/ if they changed
#   8. Uploads the large summary tables (.parquet) to the GitHub release "data-latest",
#      replacing yesterday's files. Power BI and Streamlit read them from there.
#
# Raw data is never committed (it's in .gitignore); it only lives in the cache.
# You can also start it by hand: GitHub repo -> Actions -> Daily data update -> Run workflow.

name: Daily data update

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC = 10 pm Malaysia time; data.gov.my updates around 12:00 UTC
  workflow_dispatch: # adds a manual "Run workflow" button

permissions:
  contents: write # needed to commit the updated tables and update the release

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the few libraries this job needs
        run: pip install duckdb requests pytest pandas statsmodels

      - name: Restore previously downloaded raw files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: pricecatcher-raw-${{ github.run_id }}
          restore-keys: pricecatcher-raw-

      - name: Download new or changed files
        run: python src/download.py --all   # full history since 2022 (needed for festive comparisons)

      - name: Check the raw data
        run: python src/checks.py

      - name: Clean the data and rebuild the summary tables
        run: python src/build.py

      - name: Forecast (only when the weekly prices changed)
        # The forecast fits statistical models, so re-running it on unchanged data could produce
        # tiny differences between computers. Only re-run it when there's new data.
        run: |
          if git diff --quiet -- data/marts/item_national_week.csv; then
            echo "Weekly prices unchanged, keeping the existing forecast."
          else
            python src/forecast.py
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Commit updated CSV tables (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marts
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily data update: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Publish large tables to the data-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view data-latest > /dev/null 2>&1; then
            gh release create data-latest --title "Latest data (updated daily)" \
              --notes "Summary tables rebuilt every night by the Daily data update workflow. Files are replaced each run; see docs/notes.md for what each table contains. Source: PriceCatcher (KPDN, DOSM), CC BY 4.0."
          fi
          gh release upload data-latest data/marts/*.parquet --clobber
          gh release edit data-latest --notes "Summary tables rebuilt every night by the Daily data update workflow (last run: $(date -u '+%Y-%m-%d %H:%M UTC')). Source: PriceCatcher (KPDN, DOSM), CC BY 4.0."
